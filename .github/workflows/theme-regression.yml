name: Theme regression

on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out theme
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Run all theme, accessibility, browser, and syntax checks
        run: sh temp/run-all-phases-e2e.sh
